<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Kerrymed</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">Kerrymed</a>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html?category=CT-Tube">CT Tube</a></li>
                <li><a href="products.html?category=CT-Parts">CT Parts</a></li>
                <li><a href="admin.html">Admin</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="admin-panel">
            <h2>Admin Panel</h2>

            <h3>Add/Edit Product</h3>
            <form id="product-form">
                <input type="hidden" id="product-id">
                <label for="name">Name:</label>
                <input type="text" id="name" required>
                <label for="category">Category:</label>
                <select id="category" required>
                    <option value="CT-Tube">CT Tube</option>
                    <option value="CT-Parts">CT Parts</option>
                </select>
                <label for="description">Description:</label>
                <textarea id="description" required></textarea>
                <label for="images">Images (comma-separated URLs):</label>
                <input type="text" id="images" required>
                <button type="submit">Save Product</button>
            </form>

            <h3>Product List</h3>
            <table id="admin-product-list">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Products will be dynamically loaded here -->
                </tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 Kerrymed. All rights reserved.</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
